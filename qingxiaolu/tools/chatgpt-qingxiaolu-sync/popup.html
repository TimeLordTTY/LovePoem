<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>同步到情晓录</title>
</head>
<body>
  <main>
    <header><span>晓</span><div><b>同步到情晓录</b><small>当前 ChatGPT 讨论</small></div></header>
    <section id="login">
      <label>情晓录账户<input id="username" autocomplete="username"></label>
      <label>密码<input id="password" type="password" autocomplete="current-password"></label>
      <button id="loginButton">登录</button>
    </section>
    <section id="sync" hidden>
      <label>情晓录项目<select id="project"></select></label>
      <label>保存位置<select id="category">
        <option>讨论记录</option><option>人物</option><option>世界观</option>
        <option>大纲</option><option>情节</option><option>时间轴</option>
      </select></label>
      <label>记录标题<input id="title" placeholder="自动读取当前讨论标题"></label>
      <label class="check"><input id="includeUser" type="checkbox" checked>包含我的提问</label>
      <p id="preview">点击预览，读取当前页面已经加载的讨论。</p>
      <section id="pending" hidden><b id="pendingInfo"></b><textarea id="pendingText" readonly aria-label="本机未完成的讨论正文"></textarea><button id="cancelButton">取消未完成同步</button></section>
      <div class="actions"><button id="previewButton">预览</button><button id="syncButton" class="primary">确认同步</button></div>
      <button id="refreshButton" class="link">刷新项目</button>
      <button id="logoutButton" class="link">更换账户</button>
    </section>
    <output id="message"></output>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
